name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 8 * * 1,4'  # tous les lundis + jeudi, 8h UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl "https://xkgnijhmanupvoszxszi.supabase.co/rest/v1/places?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
