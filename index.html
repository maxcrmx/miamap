<!DOCTYPE html>
<!--
  index.html — miamap, a personal "save your favorite places" app.

  This is the entire page shell: every screen (auth, map/list, filter
  panel, place detail sheet, add/edit form, settings) lives here as a
  <div>, shown/hidden via CSS classes controlled from js/app.js. There is
  no bundler/build step (per SPEC.md), so:
    - Supabase and Google Maps SDKs are loaded via plain <script> tags.
    - Our own code is loaded as ES modules (<script type="module">), which
      lets js/*.js files use import/export without a bundler.
-->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ma carte</title>

<!-- PWA / plein écran iOS -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ma carte">
<meta name="theme-color" content="#f5d842">
<link rel="apple-touch-icon" href="icon.png">

<link rel="stylesheet" href="style.css">

<script>
  // The Google Maps script tag below loads asynchronously. Our app code
  // (js/app.js, an ES module) also starts running as soon as the HTML is
  // parsed, which can be *before* Maps has finished loading. This tiny
  // promise + callback lets any module `await window.googleMapsReady`
  // instead of racing against the async script.
  window.googleMapsReady = new Promise((resolve) => { window.__resolveGoogleMapsReady = resolve; });
  function onGoogleMapsLoaded() { window.__resolveGoogleMapsReady(); }
</script>
</head>
<body>

<!-- ============================== AUTH SCREEN ============================== -->
<div id="auth-screen" class="top-screen active">
  <div class="auth-box">
    <div class="auth-icon">📍</div>
    <h1>Ma carte</h1>
    <p>Connecte-toi avec ton email pour accéder à la carte.</p>
    <form id="auth-form">
      <input type="email" id="auth-email" placeholder="ton@email.com" required autocomplete="email" />
      <button type="submit">Recevoir un lien de connexion</button>
    </form>
    <p id="auth-status" class="status-text"></p>

    <!--
      Fallback if the magic link itself fails (e.g. a mail client's link
      scanner "pre-clicks" it, consuming the one-time token before you do —
      a common real-world failure mode). Supabase's OTP email already
      contains this 6-digit code alongside the link, so this isn't a
      separate/custom auth system — just another way to redeem the same
      one-time code Supabase already sent. Always visible (not just after a
      successful send) since it's also the only way in if sending itself is
      currently rate-limited but an earlier email already arrived.
    -->
    <button type="button" id="auth-code-toggle" class="link-btn">Saisir le code reçu par email</button>
    <form id="auth-code-form" class="hidden">
      <input type="text" id="auth-code-input" placeholder="Code reçu par email" inputmode="numeric" autocomplete="one-time-code" />
      <button type="submit">Valider le code</button>
    </form>
  </div>
</div>

<!-- ============================== ÉCRAN PRINCIPAL ============================== -->
<!--
  Réf. visuelle : reference-ui/01-accueil.jpeg (Mapstr).
  - En haut, des contrôles qui FLOTTENT au-dessus de la carte : bouton rond
    "filtres" à gauche, pilule Carte/Liste au centre, bouton rond "loupe" à
    droite (il déplie la barre de recherche par nom, exigée par SPEC.md).
  - En vue liste, ce même bloc devient une barre blanche normale (classe
    .list-mode posée sur #main-screen par js/app.js) pour ne pas recouvrir
    les premières lignes de la liste.
  - En bas : barre blanche avec le gros "+" jaune centré et la roue dentée
    Settings à droite. Les deux sont admin-only, donc toute la barre l'est.
-->
<div id="main-screen" class="top-screen">
  <div class="top-overlay" id="top-overlay">
    <div class="map-controls">
      <button id="filter-open-btn" class="round-btn" aria-label="Filtres">☰</button>
      <div class="view-pill" role="tablist" aria-label="Basculer carte ou liste">
        <button id="view-map-btn" class="view-pill-seg active" role="tab">Carte</button>
        <button id="view-list-btn" class="view-pill-seg" role="tab">Liste</button>
      </div>
      <button id="search-toggle-btn" class="round-btn" aria-label="Rechercher un lieu">🔍</button>
    </div>

    <!-- Recherche par nom, repliée par défaut (la loupe l'ouvre/ferme). -->
    <div class="search-row hidden" id="search-row">
      <input type="text" id="search-input" placeholder="Rechercher un lieu..." autocomplete="off" />
    </div>

    <!-- Tri : visible uniquement en vue liste (géré par js/app.js). -->
    <div class="sort-row hidden" id="sort-row">
      <span>Trier par :</span>
      <label><input type="radio" name="sort" value="distance" checked /> Distance</label>
      <label><input type="radio" name="sort" value="rating" /> Note</label>
      <label><input type="radio" name="sort" value="price" /> Prix</label>
    </div>
  </div>

  <div id="map-container"></div>
  <div id="list-container" class="hidden"></div>

  <div class="bottom-bar admin-only hidden">
    <button id="add-place-btn" class="fab" aria-label="Ajouter un lieu">+</button>
    <button id="settings-open-btn" class="round-btn bottom-bar-right" aria-label="Réglages">⚙️</button>
  </div>
</div>

<!-- ============================== FILTER PANEL ============================== -->
<div id="filter-backdrop" class="side-backdrop"></div>
<div id="filter-panel" class="side-panel">
  <div class="side-panel-header">
    <h2>Filtres</h2>
  </div>
  <div id="filter-panel-content" class="side-panel-content"></div>
</div>

<!-- ============================== PLACE DETAIL SHEET ============================== -->
<div id="place-sheet-backdrop" class="sheet-backdrop"></div>
<div id="place-sheet" class="bottom-sheet">
  <div id="place-sheet-handle" class="sheet-handle"><span class="sheet-handle-bar"></span></div>
  <div id="place-sheet-content" class="sheet-content"></div>
</div>

<!-- ============================== FORMULAIRE AJOUT/ÉDITION ============================== -->
<!--
  Réf. visuelle : reference-ui/03-ajout-lieu.jpeg (recherche unique, pas
  d'onglets "Par nom / Par adresse / Par coordonnées") et
  reference-ui/04-fiche-edition.jpeg (pilules de tags colorées avec croix,
  bouton "+ Créer un nouveau tag", statut en deux boutons toggle).

  Le flux : un SEUL champ de recherche Google Places en haut. Choisir une
  suggestion remplit la carte "lieu sélectionné" (nom modifiable + adresse).
  Le contenu des sections tags/statut est généré par js/place-form.js.
-->
<div id="place-form-screen" class="top-screen overlay-screen admin-only">
  <div class="topbar form-topbar">
    <button type="button" id="place-form-close-x" class="round-btn" aria-label="Fermer">✕</button>
    <h2 id="place-form-title">Enregistrer un lieu</h2>
    <span class="topbar-spacer"></span>
  </div>
  <form id="place-form" class="form-body">
    <div class="place-search-block">
      <input type="text" id="place-form-search" class="place-search-input"
             placeholder="Rechercher son nom ou son adresse..." autocomplete="off" />
      <p id="place-form-address-status" class="status-text"></p>
      <div id="place-form-address-suggestions" class="address-suggestions"></div>
    </div>

    <!-- Carte du lieu choisi : cachée tant que rien n'est sélectionné (en
         mode édition, elle est pré-remplie avec le lieu existant). -->
    <div id="place-form-selected" class="place-selected-card hidden">
      <span class="place-selected-pin">📍</span>
      <div class="place-selected-body">
        <input type="text" id="place-form-name" class="place-selected-name" placeholder="Nom du lieu" />
        <p id="place-form-selected-address" class="place-selected-address"></p>
      </div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Ajoutez des tags pour catégoriser ce lieu</h3>
      <div id="place-form-tags"></div>
    </div>

    <div class="form-section">
      <h3 class="form-section-title">Choisissez le statut du lieu</h3>
      <div id="place-form-statut" class="statut-toggle-row"></div>
    </div>

    <div class="form-section">
      <!-- Note : bloc affiché UNIQUEMENT si le statut "Déjà testé" est
           sélectionné (un lieu pas encore testé n'a pas de note). La valeur
           reste un nombre, conservée dans l'input caché ci-dessous ; les
           étoiles sont pilotées par js/rating-stars.js (clic + glisser). -->
      <div class="form-label hidden" id="place-form-rating-block">
        <span>Note</span>
        <div class="rating-stars-row">
          <div id="place-form-stars" class="stars stars-input"></div>
          <span id="place-form-rating-value" class="rating-value"></span>
          <button type="button" id="place-form-rating-clear" class="btn-secondary btn-small">Effacer</button>
        </div>
        <input type="hidden" id="place-form-rating" />
      </div>

      <label class="form-label">👍 Top
        <textarea id="place-form-top" rows="3"></textarea>
      </label>
      <label class="form-label">🤷‍♂️ Flop
        <textarea id="place-form-bof" rows="3"></textarea>
      </label>
      <label class="form-label">💬 Remarques
        <textarea id="place-form-remarks" rows="3"></textarea>
      </label>
      <label class="form-label">📝 Commentaire
        <textarea id="place-form-comment" rows="2"></textarea>
      </label>
    </div>

    <!-- Gros bouton jaune pleine largeur, comme "Mettre à jour" sur la réf. -->
    <button type="submit" class="btn-save">Enregistrer</button>
  </form>
</div>

<!-- ============================== SETTINGS SCREEN ============================== -->
<div id="settings-screen" class="top-screen overlay-screen admin-only">
  <div class="topbar">
    <button type="button" id="settings-close-btn" class="icon-btn">← Retour</button>
    <h2>Réglages</h2>
  </div>
  <div class="form-body">
    <button id="logout-btn" class="btn-secondary">Se déconnecter</button>

    <h3>Inviter un lecteur</h3>
    <form id="settings-invite-form" class="invite-form">
      <input type="email" id="settings-invite-email" placeholder="email@exemple.com" required />
      <button type="submit" class="btn-primary">Inviter</button>
    </form>
    <p id="settings-invite-status" class="status-text"></p>

    <h3>Lecteurs</h3>
    <div id="settings-reader-list"></div>
  </div>
</div>

<!-- Supabase JS SDK (v2 UMD build) — exposes window.supabase.createClient -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Marker clustering library — exposes window.markerClusterer.MarkerClusterer -->
<script src="https://unpkg.com/@googlemaps/markerclusterer/dist/index.min.js"></script>

<!-- Google Maps JS API (places library included for the address autocomplete
     in the add/edit form). Calls onGoogleMapsLoaded (defined above) once ready. -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBnuLqnv74mFOif3XwWQ-eEut9Tc6gyVpY&libraries=places&callback=onGoogleMapsLoaded">
</script>

<!-- Our app code (ES module) -->
<script type="module" src="js/app.js"></script>

</body>
</html>
